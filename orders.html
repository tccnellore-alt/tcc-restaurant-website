<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173c2b"><meta name="robots" content="noindex,nofollow">
<title>TCC Order Desk</title><link rel="stylesheet" href="orders-dashboard.css">
</head>
<body>
<main class="shell">
  <section class="login-card" id="loginView">
    <div class="brand-mark">TCC</div><p class="eyebrow">THE COFFEE CLUB · NELLORE</p>
    <h1>Order Desk</h1><p class="muted">Sign in to manage incoming customer orders.</p>
    <form id="loginForm">
      <label for="username">Username</label><input id="username" name="username" autocomplete="username" required value="">
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" id="loginError" role="alert"></p><button class="primary" type="submit">Sign in</button>
    </form>
  </section>
  <section class="dashboard" id="dashboardView" hidden>
    <header class="topbar"><div><p class="eyebrow">TCC · RECEPTION</p><h1>Order Desk</h1><p class="muted" id="lastUpdated">Waiting for orders…</p></div><button class="quiet" id="logoutButton">Log out</button></header>
    <div class="stats" id="stats">
      <article><span>New</span><strong id="newCount">0</strong></article><article><span>In progress</span><strong id="progressCount">0</strong></article><article><span>Ready</span><strong id="readyCount">0</strong></article><article><span>Completed today</span><strong id="completedCount">0</strong></article>
    </div>
    <div class="toolbar"><div class="filters" id="filters">
      <button class="filter active" data-status="all">All</button><button class="filter" data-status="new">New</button><button class="filter" data-status="accepted">Accepted</button><button class="filter" data-status="preparing">Preparing</button><button class="filter" data-status="ready">Ready</button><button class="filter" data-status="completed">Completed</button>
    </div><button class="quiet" id="refreshButton">Refresh</button></div>
    <p class="error" id="dashboardError" role="alert"></p>
    <section class="orders" id="ordersList" aria-live="polite"><p class="empty">Loading orders…</p></section>
    <footer>Orders refresh automatically every 8 seconds.</footer>
  </section>
</main>
<script src="orders-dashboard.js"></script>
</body></html>
