name: Optimise TCC website images
on:
  push:
    branches: [image, qa-fixes, main]
    paths:
      - 'images/menu/**'
      - 'images/logo.png'
      - 'tools/optimize_menu_images.py'
      - '.github/workflows/optimize-menu-images.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade Pillow
      - run: python tools/optimize_menu_images.py
      - name: Commit generated WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/menu/optimized images/logo.webp images/logo-2x.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: generate optimised responsive website images"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
