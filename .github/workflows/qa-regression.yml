name: TCC QA regression suite
on:
  push:
    branches: [qa-fixes, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-and-browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image optimizer
        run: python -m pip install --upgrade Pillow
      - name: Generate optimized local test assets
        run: python tools/optimize_menu_images.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run static regression tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:e2e
