name: Build TCC Order Desk APK
on:
  workflow_dispatch:
  push:
    branches: [mobile-orderdesk]
    paths:
      - 'android-orderdesk/**'
      - '.github/workflows/android-orderdesk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-orderdesk :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tcc-orderdesk-debug-apk
          path: android-orderdesk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
