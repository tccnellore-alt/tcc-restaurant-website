<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TCC Table QR Codes</title>
<style>
:root{--green:#173c2b;--cream:#fffaf0;--gold:#b79a5a}*{box-sizing:border-box}body{margin:0;padding:24px;background:#eee9dc;color:var(--green);font-family:Arial,sans-serif}.toolbar{max-width:1100px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toolbar h1{font:600 30px Georgia,serif;margin:0}.toolbar p{margin:5px 0;color:#667168;font-size:13px}.toolbar button{border:0;border-radius:9px;background:var(--green);color:white;padding:12px 18px;font-weight:700}.sheet{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.qr-card{min-height:310px;padding:20px 16px;border:1px solid rgba(183,154,90,.8);border-radius:16px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;break-inside:avoid;box-shadow:0 4px 15px rgba(23,60,43,.06)}.brand{font:800 10px Arial,sans-serif;letter-spacing:.18em;color:var(--gold)}.qr-card h2{font:700 32px Georgia,serif;margin:10px 0 3px}.qr-card p{margin:0 0 12px;color:#647168;font-size:11px}.qr-card img{width:160px;height:160px;image-rendering:pixelated}.scan{margin-top:10px;font-size:9px;letter-spacing:.15em;font-weight:800;color:var(--green)}@media(max-width:700px){.sheet{grid-template-columns:repeat(2,minmax(0,1fr))}.qr-card{min-height:260px}.qr-card img{width:135px;height:135px}}@media print{@page{size:A4;margin:9mm}body{padding:0;background:white}.toolbar{display:none}.sheet{max-width:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:7mm}.qr-card{min-height:78mm;border-radius:4mm;box-shadow:none;padding:5mm}.qr-card img{width:39mm;height:39mm}.qr-card h2{font-size:25pt}.brand{font-size:8pt}.qr-card p{font-size:8pt}.scan{font-size:7pt}}
</style></head><body><header class="toolbar"><div><h1>TCC · Table QR Codes</h1><p>One unique QR code per table. Print this page and place each code on its matching table.</p></div><button onclick="window.print()">Print QR codes</button></header><main class="sheet" id="sheet"></main>
<script>
const tokens={"S1":"h2eEXris3D4D8m6IBXuXSDgM","S2":"USZthn1YoTQUFlDg0evy8Jnh","S3":"kUiCeOdrgMrN55mNBXjTJq4C","S4":"9YHH3w5ZFZh-x2tNi5Uvkg9e","S5":"-lwL62v32dRrbBlPCzYK3Lt6","S6":"JoJPpvS5L_C9K7Ls5e-xsBVD","C1":"AqU9WQNL9W2HJ1kqWNR_mNI1","C2":"eMEr26NU_D2mfU9T8F4216TK","C3":"LVD8Qv2kOOlnmkD-VEycAXGw","C4":"3uC34BgVGQUKHjlSaH7wM0dC","P1":"QwxX7hmjJ3WOVGpqTzvyOh3j","P2":"IXvzFxOnzsP4NBlmO7MT39HJ","P3":"Yb2f9Vc3_ZqKklNxyr1vqCro","T1":"KOeHHGbC0_nD4zr8yCX3gMNN","T2":"evQi4_RkKZ4UHnJ1OmgdedIo"},base='https://tcc-restaurant-website.pages.dev/menu.html';
const sheet=document.getElementById('sheet');
Object.entries(tokens).forEach(([table,token])=>{const url=base+'?table='+encodeURIComponent(table)+'&qr='+encodeURIComponent(token),card=document.createElement('article');card.className='qr-card';const brand=document.createElement('div');brand.className='brand';brand.textContent='TCC · THE COFFEE CLUB · NELLORE';const title=document.createElement('h2');title.textContent=table;const desc=document.createElement('p');desc.textContent='Scan to view menu & order at your table';const img=document.createElement('img');img.alt='QR code for table '+table;img.src='https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=12&data='+encodeURIComponent(url);const scan=document.createElement('div');scan.className='scan';scan.textContent='SCAN · ORDER · ENJOY';card.append(brand,title,desc,img,scan);sheet.append(card);});
</script></body></html>
